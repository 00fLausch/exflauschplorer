name: Bug report
description: Report a reproducible problem with EXfLauschPLORER
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include private data:** Tailscale tailnet names, MagicDNS names, pairing links, PINs, private paths, browser profiles, or credentials. Redact them before submitting.

        Please use the latest release and include enough detail to reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short, specific description of the problem.
      placeholder: The file list stays empty after I open a shared folder.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps. Include the share setup and what you clicked.
      placeholder: |
        1. Install with the EXE and share the user folder.
        2. Open the MagicDNS HTTPS address on the iPhone.
        3. Open a folder with more than 1,000 files.
        4. Pull to refresh.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Installation mode
      options:
        - EXE installer
        - ZIP package
        - Source build
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EXfLauschPLORER version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: tailscale
    attributes:
      label: Tailscale version
      placeholder: 1.80.0
  - type: dropdown
    id: device
    attributes:
      label: Device/browser
      options:
        - iPhone/iPad Safari (PWA)
        - Android Chrome
        - Desktop Chrome/Edge
        - Other
    validations:
      required: true
  - type: input
    id: deviceversion
    attributes:
      label: Device and browser version
      placeholder: iPhone 15, iOS 18.1, Safari 18.1
  - type: textarea
    id: shares
    attributes:
      label: Share setup
      description: Which folders/drives are shared, and is read-only mode or the PIN enabled? Do not include private paths.
      placeholder: User folder shared, read-only off, PIN on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste relevant output. Redact tailnet names, MagicDNS names, paths, PINs, and browser-profile data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private data (tailnet names, paths, PINs, profile data).
          required: true
        - label: I can reproduce this on the latest release.
          required: true
        - label: I searched existing issues.
          required: true